# Agent-runner as a Dokploy Compose service.
#
# Built from Dockerfile.agent-runner in THIS repo and deployed by push to main
# (Dokploy compose `zenod-runner`: autoDeploy + push webhook). This replaces the
# old hand-run container so the runner is rebuilt-from-code, never by hand.
#
# The image entrypoint (scripts/agent-runner-entrypoint.sh) registers the X MCP
# server in Codex on every start, so X stays wired across every redeploy with
# nothing manual. It reuses the existing auth volumes (codex login + gh auth
# survive) and joins zenod-x-net (created by the x-mcp compose) to reach X.

networks:
  zenod-x-net:
    external: true
    name: zenod-x-net
  # Dokploy's attachable overlay — lets the Zenod app reach this runner by name
  # (zenod-agent-runner:8787) to POST /poke on queue. The app is a Swarm service
  # on this network; joining it here bridges the two.
  dokploy-network:
    external: true

volumes:
  zenod-agent-work:
    external: true
  zenod-agent-codex-home:
    external: true
  zenod-agent-gh:
    external: true

services:
  zenod-agent-runner:
    build:
      context: .
      dockerfile: Dockerfile.agent-runner
    image: zenod-agent-runner:dokploy
    container_name: zenod-agent-runner
    restart: unless-stopped
    networks: [zenod-x-net, dokploy-network]
    volumes:
      - zenod-agent-work:/runner/work
      - zenod-agent-codex-home:/runner/codex-home
      - zenod-agent-gh:/runner/gh
    environment:
      # Proactive runner notifications ("working", "needs review", "blocked",
      # "merged") are delivered through the Console because it owns the live
      # WhatsApp/Telegram sockets. Legacy ZENOD_APP_URL/ZENOD_API_TOKEN are kept
      # only as fallback inputs for older deployments.
      ZENOD_NOTIFY_URL: ${ZENOD_NOTIFY_URL:-http://zenod-console:8080}
      ZENOD_NOTIFY_TOKEN: ${ZENOD_NOTIFY_TOKEN:-}
      ZENOD_APP_URL: ${ZENOD_APP_URL:-https://c1.zenod.dev}
      ZENOD_API_TOKEN: ${ZENOD_API_TOKEN}
      # Console MCP gateway: workers register this one endpoint and inherit every
      # enabled agent's curated semantic tools, forwarded to each owner with that
      # agent's own token. ZENOD_CONSOLE_TOKEN is the Console instance's own
      # api_token, not ZENOD_API_TOKEN.
      ZENOD_CONSOLE_URL: ${ZENOD_CONSOLE_URL:-http://zenod-console:8080}
      ZENOD_CONSOLE_TOKEN: ${ZENOD_CONSOLE_TOKEN}
      # Execution lane (#194): Epaminon dispatches tickets to POST /run; the runner
      # reports results back to Epaminon, gated by the lane secret it fetches from the
      # Console (GET /api/lane-secret with ZENOD_CONSOLE_TOKEN). ZENOD_EXEC_LANE_SECRET
      # may override the fetch in dev.
      ZENOD_EPAMINON_URL: ${ZENOD_EPAMINON_URL:-http://zenod-epaminon:8080}
      # Worker engine (codex CLI or Claude Code CLI, same GitHub flow). Default is
      # Claude/Sonnet 4.6; "use codex" routes a run to codex. CLAUDE_CODE_OAUTH_TOKEN
      # is the subscription OAuth token from `claude setup-token` (in the Dokploy env).
      # Do NOT set ANTHROPIC_API_KEY here — it overrides the subscription OAuth.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ZENOD_WORKER_ENGINE: ${ZENOD_WORKER_ENGINE:-claude}
      ZENOD_WORKER_MODEL: ${ZENOD_WORKER_MODEL:-claude-sonnet-4-6}
      # Point Codex at the post+read X endpoint so agents can actually tweet
      # (not just read). The entrypoint var is named *_READONLY_URL but it's
      # simply "the endpoint Codex registers" — set here to the posting instance.
      X_MCP_READONLY_URL: http://x-mcp-postread:8000/mcp
    # Monitor supervisor (was the old container's run command). The ENTRYPOINT
    # runs first (writes the Codex X config), then execs this.
    #
    # Run the IMAGE copy of the monitor (/opt/zenod/scripts) — baked fresh on
    # every push — NOT scripts/backlog-monitor.mjs from the /runner/work/zenod
    # volume checkout, which an image rebuild never refreshes (so monitor edits
    # would silently never ship). cwd stays the work checkout for git context;
    # the monitor reads ZENOD_WORKDIR for its worktree/fanout operations.
    command:
      - bash
      - -lc
      - |
        mkdir -p /runner/work/zenod/.fanout
        while true; do
          echo "[supervisor] starting monitor $(date -u +%FT%TZ)" >> /runner/work/zenod/.fanout/monitor.log
          cd /runner/work/zenod && node /opt/zenod/scripts/backlog-monitor.mjs >> /runner/work/zenod/.fanout/monitor.log 2>&1
          echo "[supervisor] monitor exited rc=$? restart in 5s $(date -u +%FT%TZ)" >> /runner/work/zenod/.fanout/monitor.log
          sleep 5
        done
