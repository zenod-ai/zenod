# Callistheness — the headless OUTBOUND-COMMS agent. Internal MCP server the Console
# (c1) loads over dokploy-network; reachable only as http://zenod-outbound:8080.
#
# Boots UN-PROVISIONED (ZENOD_AWAIT_PROVISION=1): mints no token, idles until c1
# MINTS its token and pushes config (the shared LLM key) to /api/provision. Owns NO
# repo and needs no vault — AGENT=outbound runs the engine with the outbound SEND
# tools wired into its chat brain: post to X, post to Reddit, send email. Its domain
# is SENDING — there is no inbox; the UX is the chat. It is the guardian of outbound
# comms and ALWAYS confirms before anything is published/sent. NOT exposed publicly.
# See docs/SUITE-AGENT-PATTERN.md.
#
# The send capabilities live in their OWN deployed MCP connectors that Callistheness
# reaches over the docker network. Point each at its connector with the
# OUTBOUND_*_MCP_URL env. A connector whose URL is unset is simply "not connected
# yet" — the tool reports it and never fakes a send, so the X/Reddit/email channels
# can be wired in one at a time as their containers come online.
#
# DECOUPLED BY DESIGN: this service boots on `dokploy-network` ALONE and needs NO
# connector to start (it just idles un-provisioned). Wiring X is a SEPARATE step so
# standing up this container never depends on x-mcp being deployed first:
#
#   X (Twitter)  -> the vendored x-mcp (services/x-mcp), POST instance (createPosts).
#                   To connect it: deploy x-mcp (it creates the `zenod-x-net`
#                   network), then add `zenod-x-net` to this service's networks (see
#                   the commented block below) AND set OUTBOUND_X_MCP_URL. Until
#                   then post_tweet reports "X is not connected yet". (issue #180)
#   Reddit       -> the vendored reddit-mcp (services/reddit-mcp), a single write
#                   instance (create_post). It creates the `zenod-reddit-net`
#                   network; Callistheness joins it (external) and reaches
#                   reddit-mcp by name. Wired below (issue #185).
#   Email        -> a mail-mcp (clone the x-mcp shape; FOLLOW-UP, issue #185).

networks:
  dokploy-network:
    external: true
  # The x-mcp compose (services/x-mcp) owns/creates this network; x-mcp is deployed,
  # so Callistheness joins it (external) to reach x-mcp-postread by name for posting.
  zenod-x-net:
    external: true
  # The reddit-mcp compose (services/reddit-mcp) owns/creates this network. Joining
  # a MISSING external network fails the whole compose boot, so — exactly like
  # zenod-x-net above — uncomment this (and the networks entry + Reddit envs below)
  # only AFTER the reddit-mcp Dokploy service is bound and deployed (operator steps
  # on issue #420). Until then Callistheness boots without Reddit and post_reddit
  # reports "not connected".
  # zenod-reddit-net:
  #   external: true

volumes:
  zenod-outbound-data:

services:
  zenod-outbound:
    build:
      context: .
      dockerfile: Dockerfile
    image: zenod-outbound:dokploy
    container_name: zenod-outbound
    restart: unless-stopped
    # dokploy-network (so the Console reaches it) + zenod-x-net (so it reaches the
    # x-mcp POST connector for tweeting). Add zenod-reddit-net once reddit-mcp is
    # deployed (see the networks block above).
    networks: [dokploy-network, zenod-x-net]
    volumes:
      - zenod-outbound-data:/data
    environment:
      AGENT: outbound
      ZENOD_AWAIT_PROVISION: "1"
      ZENOD_DATA_DIR: /data
      PORT: "8080"
      # X connector — the vendored x-mcp POST instance (FastMCP Streamable HTTP at
      # /mcp, posting via createPosts). Reached over zenod-x-net by container name.
      OUTBOUND_X_MCP_URL: http://x-mcp-postread:8000/mcp
      # X READ connector — the vendored x-mcp READ-ONLY instance (read operationIds
      # only; no createPosts). Reached over zenod-x-net by container name. Powers
      # Callistheness's ungated read tools (x_get_post/x_search_posts/x_read_mentions/
      # x_read_timeline/x_get_user/x_whoami). (issue #422)
      OUTBOUND_X_READ_MCP_URL: http://x-mcp-readonly:8000/mcp
      # Reddit connector — the vendored reddit-mcp (services/reddit-mcp), single
      # write instance serving Streamable HTTP at /mcp on port 3000, posting via
      # create_post. Reached over zenod-reddit-net by container name. The token must
      # match reddit-mcp's OAUTH_TOKEN (its REDDIT_MCP_OAUTH_TOKEN secret).
      # Uncomment together with the zenod-reddit-net join once reddit-mcp is
      # deployed (operator steps on issue #420); until then post_reddit reports
      # "not connected" instead of failing the boot.
      # OUTBOUND_REDDIT_MCP_URL: http://reddit-mcp:3000/mcp
      # OUTBOUND_REDDIT_MCP_TOKEN: ${REDDIT_MCP_OAUTH_TOKEN}
      # Email connector — mail-mcp is a FOLLOW-UP (issue #185); leave unset so
      # send_email reports "not connected" rather than faking a send until deployed.
      # OUTBOUND_MAIL_MCP_URL: http://mail-mcp:8000/mcp
      # OUTBOUND_MAIL_MCP_TOKEN: ${MAIL_MCP_OAUTH_TOKEN}
    expose:
      - "8080"
