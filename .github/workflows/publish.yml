name: Publish image

# Builds the Zenod and dedicated Phylax runtime images from main and pushes them
# to GHCR so each hosted service can pin its own exact artifact instead of
# building from source. Self-hosters keep building from the Dockerfiles; this is
# only the hosted-fleet delivery path.
#
# Tags:
#   ghcr.io/zenod-ai/{zenod,phylax}:latest      — moving pointers
#   ghcr.io/zenod-ai/{zenod,phylax}:sha-<short> — immutable, for pinning/rollback
#
# See docs/HOSTED-PLAN-2026-07-02.md (P0.2, epic #448).
#
# Docs-only pushes (docs/**, any *.md) neither publish nor deploy; the paths that
# do are AGENTS.md's `Deploy gate:`. Two docs-tree files are baked into the image
# and so still trigger: docs/tool-output-schemas.v4.json (Dockerfile COPY) and
# units/zenod/skill/** (served Zenod skill, *.md). Later patterns override earlier
# ones, so the re-includes must stay after the excludes.

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/tool-output-schemas.v4.json"
      - "units/zenod/skill/**"
  workflow_dispatch: {}

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  # Full CI (ci.yml) on the exact commit; nothing is published or rolled if it is red.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zenod-ai/zenod
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Phylax Docker metadata (tags + labels)
        id: phylax_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zenod-ai/phylax
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image for boot smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: zenod-runtime-smoke:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke runtime image
        env:
          IMAGE: zenod-runtime-smoke:${{ github.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          name="zenod-runtime-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker logs "$name" || true
            docker rm -fv "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$name" -p 127.0.0.1:18080:8080 \
            -e CONTROL_PLANE_TOKEN=epic32-publish-smoke \
            -e CHASSIS_VAULT_MASTER_KEY=1111111111111111111111111111111111111111111111111111111111111111 \
            "$IMAGE"

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:18080/healthz > chassis-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          jq --exit-status '.status == "ok" and .name == "zenod"' chassis-health.json

          tenant_token="$(curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
            --request POST \
            --header 'Authorization: Bearer epic32-publish-smoke' \
            --header 'Content-Type: application/json' \
            --data '{"tenantId":"publish-smoke","name":"Publish smoke","plan":"test"}' \
            http://127.0.0.1:18080/api/tenants | jq --exit-status --raw-output '.token')"
          test -n "$tenant_token"
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
            --header "Authorization: Bearer ${tenant_token}" \
            http://127.0.0.1:18080/api/health > health.json
          jq --exit-status --arg sha "$EXPECTED_SHA" \
            '.status == "ok" and .sha == $sha' health.json
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:18080/ > index.html
          asset_path="$(sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' index.html | head -1)"
          test -n "$asset_path"
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
            "http://127.0.0.1:18080${asset_path}" >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:18080/api/settings)" = "401"

      - name: Build dedicated Phylax image for contract smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          file: units/phylax/Dockerfile
          platforms: linux/amd64
          load: true
          tags: phylax-runtime-smoke:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke dedicated Phylax image
        env:
          PHYLAX_CONTRACT_IMAGE: phylax-runtime-smoke:${{ github.sha }}
          PHYLAX_CONTRACT_SKIP_BUILD: "1"
          PHYLAX_PLATFORM: linux/amd64
        run: npm run test:phylax-image-contract

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Default target is the runtime stage (whisper-cli baked in), i.e. the
          # exact image the Dockerfile CMD runs — not the build-check stage.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Lets /api/health report the exact commit this image was built from (#532).
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dedicated Phylax image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: units/phylax/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.phylax_meta.outputs.tags }}
          labels: ${{ steps.phylax_meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Zenod PRODUCTION rolls are made OUTSIDE GitHub: dokploy.polyqu.com was closed on
  # 2026-10-22 (the Dokploy panel is Tailscale-only), so a GitHub runner can no longer
  # reach the Dokploy API (it answered 404 here). The outbound deploy poller on VPS1
  # (infra-vps `infra-vps-deploy-poller.timer`, every 2 min) sees this workflow's
  # `publish` job succeed on main, re-pins Dokploy app zenod-mt (zenod/production) to
  # ghcr.io/zenod-ai/zenod:sha-<short> and verifies /api/health, rolling back on failure.
  # This job only PROVES the roll: it fails red when production does not report this sha.
  #
  # Boundary (AGENTS.md "Production deployment boundary", 2026-09-07): Zenod production
  # only; the dedicated Phylax image is published but never rolled, and independent
  # agents are not touched. No Dokploy secret lives in GitHub. Manual rollback or a
  # roll by hand: scripts/deploy-fleet.sh over the tailnet (docs/DEPLOYMENTS.md).
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # poller interval (2 min) + Dokploy's shared FIFO queue (up to ~12 min behind an
    # unrelated build, see scripts/deploy-fleet.sh) + the ~40 s roll; keep the job
    # limit above the 900 s wait below.
    timeout-minutes: 25
    permissions:
      contents: read
    # A newer push replaces a still-waiting check: only the latest main is expected live.
    concurrency:
      group: deploy-zenod-production
      cancel-in-progress: true
    steps:
      - name: Wait for production to report the published sha
        env:
          VERIFY_URL: https://cloud.zenod.dev/api/health
          EXPECTED_SHA: ${{ github.sha }}
          TIMEOUT_SECONDS: "900"
        run: |
          start=$(date +%s)
          live=""
          while :; do
            live="$(curl --silent --show-error --max-time 10 "$VERIFY_URL" | jq -r '.sha // empty' || true)"
            if [ "$live" = "$EXPECTED_SHA" ]; then
              echo "production reports $EXPECTED_SHA after $(( $(date +%s) - start ))s"
              exit 0
            fi
            if [ $(( $(date +%s) - start )) -ge "$TIMEOUT_SECONDS" ]; then
              echo "::error::production still reports '${live:-<unreachable>}' after ${TIMEOUT_SECONDS}s, expected $EXPECTED_SHA. The VPS1 deploy poller (infra-vps-deploy-poller.timer) rolls zenod-mt; check its journal."
              exit 1
            fi
            sleep 10
          done
