name: Publish image

# Builds the runtime image from main and pushes it to GHCR so every tenant
# stack (including tenant zero) can run the exact same artifact instead of
# building from source. Self-hosters keep building from the Dockerfile; this is
# only the hosted-fleet delivery path.
#
# Tags:
#   ghcr.io/zenod-ai/zenod:latest      — moving pointer the fleet rolls to
#   ghcr.io/zenod-ai/zenod:sha-<short> — immutable, for pinning/rollback
#
# See docs/HOSTED-PLAN-2026-07-02.md (P0.2, epic #448).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zenod-ai/zenod
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image for boot smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: zenod-runtime-smoke:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke runtime image
        env:
          IMAGE: zenod-runtime-smoke:${{ github.sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          name="zenod-runtime-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker logs "$name" || true
            docker rm -fv "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$name" -p 127.0.0.1:18080:8080 \
            -e CONTROL_PLANE_TOKEN=epic32-publish-smoke \
            -e CHASSIS_VAULT_MASTER_KEY=1111111111111111111111111111111111111111111111111111111111111111 \
            "$IMAGE"

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:18080/healthz > chassis-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          jq --exit-status '.status == "ok" and .name == "zenod"' chassis-health.json

          tenant_token="$(curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
            --request POST \
            --header 'Authorization: Bearer epic32-publish-smoke' \
            --header 'Content-Type: application/json' \
            --data '{"tenantId":"publish-smoke","name":"Publish smoke","plan":"test"}' \
            http://127.0.0.1:18080/api/tenants | jq --exit-status --raw-output '.token')"
          test -n "$tenant_token"
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
            --header "Authorization: Bearer ${tenant_token}" \
            http://127.0.0.1:18080/api/health > health.json
          jq --exit-status --arg sha "$EXPECTED_SHA" \
            '.status == "ok" and .sha == $sha' health.json
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:18080/ > index.html
          asset_path="$(sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' index.html | head -1)"
          test -n "$asset_path"
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
            "http://127.0.0.1:18080${asset_path}" >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:18080/api/settings)" = "401"

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Default target is the runtime stage (whisper-cli baked in), i.e. the
          # exact image the Dockerfile CMD runs — not the build-check stage.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Lets /api/health report the exact commit this image was built from (#532).
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
