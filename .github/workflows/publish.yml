name: Publish image

# Builds the runtime image from main and pushes it to GHCR so every tenant
# stack (including tenant zero) can run the exact same artifact instead of
# building from source. Self-hosters keep building from the Dockerfile; this is
# only the hosted-fleet delivery path.
#
# Tags:
#   ghcr.io/zenod-ai/zenod:latest      — moving pointer the fleet rolls to
#   ghcr.io/zenod-ai/zenod:sha-<short> — immutable, for pinning/rollback
#
# See docs/HOSTED-PLAN-2026-07-02.md (P0.2, epic #448).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zenod-ai/zenod
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Default target is the runtime stage (whisper-cli baked in), i.e. the
          # exact image the Dockerfile CMD runs — not the build-check stage.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
