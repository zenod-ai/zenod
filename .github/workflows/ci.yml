name: CI

# Also called by publish.yml (workflow_call) so production is never rolled from a
# commit whose tests are red. Push runs stay unfiltered: some tests read files
# under docs/ (e.g. productionReadiness, phylaxBaselineContract), so a docs-only
# push still gets a ci signal even though it does not publish or deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker build --target build -t zenod-build-check .
      - run: npm run build:phylax -w @zenod/server
      - run: npm run test:phylax-image-contract
      - run: npm test
      # E15-Q2: the memory test suite on the demo vault; numbers in the job summary, fails under the floor.
      - run: node scripts/memory-eval/run.mjs --checkout . --dataset demo --out memory-eval.json --floor scripts/memory-eval/floor.json
      # E15-Q3: the live tier's cache and spend caps, on a stub client (no key, no network).
      - run: node --test scripts/memory-eval/live.test.mjs
