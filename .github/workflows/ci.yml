name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker build --target build -t zenod-build-check .
      - run: npm run build:phylax -w @zenod/server
      - run: npm run test:phylax-image-contract
      - run: npm test
