name: MCP Registry

# Publishes Zenod's listing (docs/epic10/server.json) to the official MCP
# Registry as io.github.zenod-ai/zenod whenever that file changes on main.
# The io.github.zenod-ai namespace is proven by this repository's own GitHub
# Actions OIDC token (no secret, no DNS record). Bump "version" in server.json
# to publish; an already-published version is skipped. Title "Zenod", website
# https://zenod.dev. See EPIC-10 rows E10-R3 and E10-S1
# (docs/zenod-in-every-mcp-directory-listing-spr.md).
#
# Retiring an old listing name (E10-S1): run this workflow by hand with
# `retire_name` set. It signs in to the zenod.dev namespace by DNS (the
# MCP_REGISTRY_PRIVATE_KEY secret matches the zenod.dev TXT record
# `v=MCPv1; k=ed25519; p=...`) and sets every version of that name to
# status "deleted", which hides it from registry listings and tells the
# directories that copy the registry to drop it.

on:
  push:
    branches: [main]
    paths:
      - "docs/epic10/server.json"
      - ".github/workflows/mcp-registry.yml"
  workflow_dispatch:
    inputs:
      retire_name:
        description: "Old listing name to set to deleted (all versions), signed in by DNS on zenod.dev; leave empty to only publish"
        required: false
        default: ""

concurrency:
  group: mcp-registry
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PUBLISHER_VERSION: v1.8.9
  SERVER_JSON: docs/epic10/server.json
  REGISTRY: https://registry.modelcontextprotocol.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Listing copy says Zenod and zenod.dev (E10-S1 guard)
        run: |
          scripts/ci/check-no-reversed-domain.sh
          jq -e '.title == "Zenod" and .websiteUrl == "https://zenod.dev" and (.name | startswith("io.github.zenod-ai/"))' "$SERVER_JSON" >/dev/null \
            || { echo "server.json must keep title Zenod, website https://zenod.dev and an io.github.zenod-ai/ name"; exit 1; }

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate server.json
        run: ./mcp-publisher validate "$SERVER_JSON"

      - name: Skip if this version is already published
        id: check
        run: |
          name=$(jq -r .name "$SERVER_JSON")
          version=$(jq -r .version "$SERVER_JSON")
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "${REGISTRY}/v0.1/servers/$(jq -rn --arg n "$name" '$n|@uri')/versions/${version}")
          echo "registry has ${name}@${version}: HTTP ${code}"
          if [ "$code" = "200" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi

      - name: Log in (GitHub OIDC) and publish
        if: steps.check.outputs.publish == 'true'
        run: |
          ./mcp-publisher login github-oidc >/dev/null
          ./mcp-publisher publish "$SERVER_JSON"
          ./mcp-publisher logout >/dev/null || true

      - name: Confirm in registry search
        run: |
          name=$(jq -r .name "$SERVER_JSON")
          version=$(jq -r .version "$SERVER_JSON")
          for i in $(seq 1 12); do
            if curl -fsS "${REGISTRY}/v0.1/servers?search=$(jq -rn --arg n "$name" '$n|@uri')" \
              | jq -e --arg n "$name" --arg v "$version" '[.servers[].server | select(.name==$n and .version==$v)] | length > 0' >/dev/null; then
              echo "${name}@${version} is listed"; exit 0
            fi
            sleep 15
          done
          echo "${name}@${version} not in registry search after 3 minutes"; exit 1

      - name: Retire an old listing name (by hand only)
        if: github.event_name == 'workflow_dispatch' && inputs.retire_name != ''
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
          RETIRE_NAME: ${{ inputs.retire_name }}
        run: |
          case "$RETIRE_NAME" in */*) ;; *) echo "retire_name must look like namespace/name"; exit 1;; esac
          new=$(jq -r .name "$SERVER_JSON")
          ./mcp-publisher login dns --domain zenod.dev --private-key "$MCP_REGISTRY_PRIVATE_KEY" >/dev/null
          ./mcp-publisher status --status deleted --all-versions --yes \
            --message "Moved to ${new} (Zenod, https://zenod.dev)" "$RETIRE_NAME"
          ./mcp-publisher logout >/dev/null || true
          left=$(curl -fsS "${REGISTRY}/v0.1/servers?search=$(jq -rn --arg n "$RETIRE_NAME" '$n|@uri')" \
            | jq --arg n "$RETIRE_NAME" '[.servers[] | select(.server.name==$n)] | length')
          echo "versions of ${RETIRE_NAME} still in default registry listings: ${left}"
          [ "$left" = "0" ]
