# Native/standalone Phylax. The same dedicated artifact is also used by the
# fixed Zenod and PM islands; only the immutable instance mode and deployment-
# owned storage/origin differ. Existing `phylax-data` mounts in place.

networks:
  dokploy-network:
    external: true

volumes:
  phylax-data:

services:
  phylax:
    # The checked-in whisper fallback is the proven musl/amd64 binary used by
    # the current service. Keep that runtime intact and make its target explicit.
    platform: ${PHYLAX_PLATFORM:-linux/amd64}
    build:
      context: ../..
      dockerfile: units/phylax/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:?required}
    # Keep the existing default tag so a rolling source-build does not select a
    # new image reference merely because the artifact now has its own Dockerfile.
    image: ${PHYLAX_IMAGE:-zenod-phylax-customer}
    environment:
      NODE_ENV: production
      PORT: "8080"
      ZENOD_UNIT: phylax
      AGENT: phylax
      PHYLAX_INSTANCE_MODE: ${PHYLAX_INSTANCE_MODE:-standalone}
      PHYLAX_INSTANCE_ID: ${PHYLAX_INSTANCE_ID:-phylax-standalone}
      PHYLAX_SERVICE_NUMBER_ID: ${PHYLAX_SERVICE_NUMBER_ID:-standalone-primary}
      PHYLAX_ADMIN_ORIGIN: ${PHYLAX_ADMIN_ORIGIN:-https://phylax.zenod.dev}
      ZENOD_DATA_DIR: /data
      ZENOD_WEB_DIST: /app/apps/web/dist
      PHYLAX_SITE_DIST: /app/apps/phylax-site/dist
      CUSTOMER_APP_URL: https://phylax.zenod.dev
      DOMAIN: https://phylax.zenod.dev
      GITHUB_OAUTH_CALLBACK_URL: https://phylax.zenod.dev/auth/github/callback
      ZC_COOKIE_DOMAIN: phylax.zenod.dev
      PHYLAX_ADMIN_GITHUB_LOGIN: alfablok
      PHYLAX_FULL_CUSTOMER_UNIT: "1"
      STRIPE_MODE: test
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?required}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?required}
      ACCOUNT_STATE_SECRET: ${ACCOUNT_STATE_SECRET:?required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?required}
      PRICE_MONTHLY: ${PRICE_MONTHLY:?required}
      PRICE_YEARLY: ${PRICE_YEARLY:?required}
      CHASSIS_VAULT_MASTER_KEY: ${CHASSIS_VAULT_MASTER_KEY:?required}
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?required}
    volumes:
      - phylax-data:/data
    expose: ["8080"]
    networks: [dokploy-network]
    restart: unless-stopped
