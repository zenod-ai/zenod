# Callisthenes deploys and sells as one atomic Dokploy compose. Only calli-front
# is public; calli-engine stays on the private unit network.

networks:
  callisthenes-private:
  dokploy-network:
    external: true

volumes:
  callisthenes-data:

services:
  calli-front:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:?required}
    image: ${CALLISTHENES_FRONT_IMAGE:-zenod-callisthenes-front}
    environment:
      NODE_ENV: production
      PORT: "8080"
      ZENOD_UNIT: callisthenes
      ZENOD_DATA_DIR: /data
      CALLISTHENES_SITE_DIST: /app/apps/calli-site/dist
      CALLISTHENES_WEB_DIST: /app/apps/calli-web/dist
      CALLISTHENES_ENGINE_URL: http://calli-engine:8000
      CUSTOMER_APP_URL: https://calli.zenod.dev
      DOMAIN: https://calli.zenod.dev
      GITHUB_OAUTH_CALLBACK_URL: https://calli.zenod.dev/auth/github/callback
      ZC_COOKIE_DOMAIN: calli.zenod.dev
      STRIPE_MODE: test
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?required}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?required}
      ACCOUNT_STATE_SECRET: ${ACCOUNT_STATE_SECRET:?required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?required}
      PRICE_MONTHLY: ${PRICE_MONTHLY:?required}
      PRICE_YEARLY: ${PRICE_YEARLY:?required}
      CHASSIS_VAULT_MASTER_KEY: ${CHASSIS_VAULT_MASTER_KEY:?required}
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?required}
    volumes:
      - callisthenes-data:/data
    expose: ["8080"]
    depends_on:
      calli-engine:
        condition: service_started
    networks: [callisthenes-private, dokploy-network]
    restart: unless-stopped

  calli-engine:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        XMCP_REF: "63d34362d88ed9f94d54ccd5ecd5bb4d12e11759"
    image: ${CALLISTHENES_ENGINE_IMAGE:-zenod-callisthenes-engine}
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      CALLISTHENES_DATA_DIR: /data/engine
      CALLISTHENES_MCP_URL: https://calli.zenod.dev/mcp
      X_OAUTH_CONSUMER_KEY: ${X_OAUTH_CONSUMER_KEY:?required}
      X_OAUTH_CONSUMER_SECRET: ${X_OAUTH_CONSUMER_SECRET:?required}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:?required}
      X_API_TOOL_ALLOWLIST: getPostsById,getPostsByIds,searchPostsRecent,getUsersPosts,getUsersById,getUsersByUsername,getUsersMe,getUsersMentions,createPosts,deletePosts,mediaUpload
      CALLISTHENES_THROTTLE_PER_HOUR: ${CALLISTHENES_THROTTLE_PER_HOUR:-10}
      CALLISTHENES_SEND_TOOLS: createPosts,deletePosts,mediaUpload,post_reddit
      CALLISTHENES_GUARDED_TOOLS: createPosts,deletePosts,mediaUpload,post_reddit
      CALLISTHENES_APPROVE_ARG: callisthenes_approve
    volumes:
      - callisthenes-data:/data
    expose: ["8000"]
    networks: [callisthenes-private]
    restart: unless-stopped
