<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--panel:#181f29;--panel2:#212b37;--line:#303b49;--text:#edf2f7;--muted:#9aa8b8;--blue:#63b3ed;--green:#68d7a5;--amber:#f6bd60;--red:#ff8179;--purple:#c59cff;--candidate:#6b7684;--shortlisted:#63b3ed;--contacted:#f6bd60;--chosen:#68d7a5;--rejected:#ff8179}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{padding:14px 20px 28px;max-width:1400px;margin:0 auto}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:19px;margin:0;letter-spacing:-.3px}
.subtitle{color:var(--muted);font-weight:600;font-size:13px}
.badge-lock{border:1px solid #34507a;background:#16263c;color:var(--blue);border-radius:999px;padding:3px 10px;font-weight:750;font-size:11px;white-space:nowrap}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin:10px 0}
.control{display:flex;align-items:center;gap:6px}
.control label{color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap}
.control input,.control select{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);padding:0 8px;font-size:13px}
.control input{min-width:210px}
.control.check{color:var(--muted);font-weight:700;cursor:pointer}
.control.check input{width:16px;height:16px;min-width:0;padding:0;margin:0;flex:none}
.chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--text)}
.legend{color:var(--muted);font-size:12px;margin:0 0 6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 12px}.dot:first-child{margin-left:0}
.d-candidate{background:var(--candidate)}.d-shortlisted{background:var(--shortlisted)}.d-contacted{background:var(--contacted)}.d-chosen{background:var(--chosen)}.d-rejected{background:var(--rejected)}
.tablebox{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:14px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
th{position:sticky;top:0;z-index:2;background:var(--panel2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:8px 10px;white-space:nowrap}
th[data-sort]{cursor:pointer}td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
a{color:var(--blue);font-weight:750;text-decoration:none}a:hover{text-decoration:underline}
.name{min-width:230px;max-width:300px}.small{color:var(--muted);font-size:12px;margin-top:3px}
.price,.score{font-size:15px;font-weight:800;white-space:nowrap}.rating{font-weight:800;white-space:nowrap}.muted{color:var(--muted)}
.star{color:#f5a623}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;white-space:nowrap}
.s-candidate{background:#2a3341;color:var(--muted)}.s-shortlisted{background:#173b5a;color:#8dccff}.s-contacted{background:#4b3515;color:var(--amber)}.s-chosen{background:#103c2d;color:var(--green)}.s-rejected{background:#4a2320;color:var(--red)}
.why{color:var(--red);font-size:12px;margin-top:4px;max-width:220px}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin:0 4px 4px 0;font-size:11px;color:#c9d3df}
.ev{max-width:320px;font-size:12px;color:#c9d3df;margin-bottom:5px}.ev .etype{color:var(--purple);font-weight:700}
.risk{color:var(--amber);font-size:12px;max-width:230px;margin-bottom:3px}
.criteria,.note{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 14px;margin:0 0 10px}
.criteria h2{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 6px}
.criteria ul{margin:0;padding-left:18px}.note{color:var(--muted)}.note strong{color:var(--amber)}
.footer{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:0 0 14px}.footer code{color:#c9d3df}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><h1>{{TITLE}}</h1><span class="subtitle" id="subtitle"></span><span class="badge-lock">{{BADGE}}</span></div>
<section class="controls">
<div class="control"><label for="status">Status</label><select id="status"><option value="all">All statuses</option></select></div>
<div class="control"><label for="area">Area</label><select id="area"><option value="all">Any area</option></select></div>
<div class="control"><label for="tag">Tag</label><select id="tag"><option value="all">Any tag</option></select></div>
<div class="control"><label for="search">Search</label><input id="search" placeholder="Name, area, tag, evidence, note"></div>
<label class="control check" for="starredOnly"><input type="checkbox" id="starredOnly"><span id="starredLabel">★ Starred only</span></label>
<div class="chips" id="metrics"></div>
</section>
<div class="legend"><span class="dot d-candidate"></span>Candidate <span class="dot d-shortlisted"></span>Shortlisted <span class="dot d-contacted"></span>Contacted <span class="dot d-chosen"></span>Chosen <span class="dot d-rejected"></span>Rejected</div>
<div class="tablebox"><table><thead><tr id="slhead"></tr></thead><tbody id="slbody"></tbody></table></div>
<div class="footer"><span>{{FOOTER}}</span><span id="count"></span></div>
<section class="criteria"><h2>Criteria</h2><ul id="criteria"></ul></section>
<div id="notes"></div>
</main>
<script>
const SL={{SHORTLIST_JSON}};
const ITEMS=Array.isArray(SL.items)?SL.items:[];
const STATUS={
candidate:{label:'Candidate',cls:'s-candidate'},shortlisted:{label:'Shortlisted',cls:'s-shortlisted'},
contacted:{label:'Contacted',cls:'s-contacted'},chosen:{label:'Chosen',cls:'s-chosen'},rejected:{label:'Rejected',cls:'s-rejected'}};
const LABELS={score:'Score',area:'Area',price:'Price',rating:'Rating',tags:'Tags',evidence:'Evidence',risks:'Risks',notes:'Notes',status:'Status'};
const SORT={name:'name',score:'_score',rating:'_rating',price:'_price',area:'area',evidence:'_evidenceText',notes:'notes',status:'_status'};
const DEFAULT_COLUMNS=['score','area','price','rating','tags','evidence','risks','status'];
const requested=Array.isArray(SL.columns)?SL.columns.filter((c)=>typeof c==='string'):[];
const columns=requested.length?requested:DEFAULT_COLUMNS;

const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v)=>(v==null||v===''||isNaN(Number(v))?null:Number(v));
const list=(v)=>Array.isArray(v)?v:[];
const q=(id)=>document.getElementById(id);

const items=ITEMS.map((it)=>{
const price=it.price||{};
return Object.assign({},it,{
_status:STATUS[it.status]?it.status:'candidate',
_tags:list(it.tags),_evidence:list(it.evidence),_risks:list(it.risks),
_score:num(it.score)==null?-Infinity:num(it.score),
_rating:num(it.rating)==null?-Infinity:num(it.rating),
_price:num(price.amount)==null?Infinity:num(price.amount),
_evidenceText:list(it.evidence).map((e)=>[e.type,e.quote].filter(Boolean).join(' ')).join(' ')});
});

const money=(p)=>{const amt=num(p&&p.amount);if(amt==null)return '<span class="muted">—</span>';
const cur=p.currency?String(p.currency).toUpperCase()+' ':'';const s=cur+amt.toLocaleString();
return '<span class="price">'+esc(s)+'</span>'+(p.unit?'<div class="small">'+esc(p.unit)+'</div>':'');};
const ratingCell=(r)=>{if(num(r.rating)==null&&num(r.reviewCount)==null)return '<span class="muted">—</span>';
const rt=num(r.rating)==null?'<span class="muted">—</span>':'<span class="rating">'+esc(r.rating)+'</span>';
const rc=num(r.reviewCount)==null?'':' <span class="muted">('+esc(r.reviewCount)+')</span>';return rt+rc;};
const raw=(v)=>{if(v==null||v==='')return '<span class="muted">—</span>';
if(Array.isArray(v))return v.length?v.map((x)=>'<span class="tag">'+esc(x)+'</span>').join(''):'<span class="muted">—</span>';
if(typeof v==='object')return '<span class="small">'+esc(JSON.stringify(v))+'</span>';return esc(v);};

const cellFor=(key,r)=>{
if(key==='score')return num(r.score)==null?'<span class="muted">—</span>':'<span class="score">'+esc(num(r.score).toFixed(1))+'</span>';
if(key==='rating')return ratingCell(r);
if(key==='price')return money(r.price);
if(key==='tags')return raw(r._tags);
if(key==='evidence')return r._evidence.length?r._evidence.map((e)=>{
const t='<span class="etype">'+esc(e.type||'evidence')+'</span>';
const qt=e.quote?' “'+esc(e.quote)+'”':'';
const lk=e.url?' <a target="_blank" rel="noreferrer" href="'+esc(e.url)+'">link</a>':'';
return '<div class="ev">'+t+qt+lk+'</div>';}).join(''):'<span class="muted">—</span>';
if(key==='risks')return r._risks.length?r._risks.map((k)=>'<div class="risk">⚠ '+esc(k)+'</div>').join(''):'<span class="muted">—</span>';
if(key==='status'){const st=STATUS[r._status];
const why=r._status==='rejected'&&r.rejectedReason?'<div class="why">'+esc(r.rejectedReason)+'</div>':'';
return '<span class="badge '+st.cls+'">'+st.label+'</span>'+why;}
return raw(r[key]);};

const head=q('slhead'),body=q('slbody');
head.innerHTML=['<th data-sort="name">Name ↕</th>'].concat(columns.map((c)=>{
const k=Object.prototype.hasOwnProperty.call(SORT,c)?SORT[c]:c;
return '<th data-sort="'+esc(k)+'">'+esc(LABELS[c]||c)+' ↕</th>';})).join('');

let sortKey='_score',ascending=false;
function filtered(){
const st=q('status').value,ar=q('area').value,tg=q('tag').value,text=q('search').value.trim().toLowerCase(),star=q('starredOnly').checked;
const shown=items.filter((r)=>(st==='all'||r._status===st)&&(ar==='all'||r.area===ar)&&(tg==='all'||r._tags.includes(tg))&&
(!star||r.starred)&&(!text||[r.name,r.area,r._tags.join(' '),r.notes,r._evidenceText].filter(Boolean).join(' ').toLowerCase().includes(text)));
shown.sort((a,b)=>{const x=a[sortKey],y=b[sortKey];
if(typeof x==='number'&&typeof y==='number')return (x-y)*(ascending?1:-1);
return String(x==null?'':x).localeCompare(String(y==null?'':y))*(ascending?1:-1);});
return shown;}

function draw(){
const shown=filtered();
body.innerHTML=shown.map((r)=>{
const name='<td class="name"><a target="_blank" rel="noreferrer" href="'+esc(r.url||'#')+'">'+
(r.starred?'<span class="star" title="Starred">★</span> ':'')+esc(r.name||r.id||'Item')+'</a>'+
'<div class="small">'+esc(r.id||'')+'</div></td>';
return '<tr data-status="'+r._status+'">'+name+columns.map((c)=>'<td>'+cellFor(c,r)+'</td>').join('')+'</tr>';}).join('');
q('count').textContent=shown.length+' of '+items.length+' shown';}

const statusSel=q('status'),areaSel=q('area'),tagSel=q('tag');
Object.keys(STATUS).forEach((s)=>{const n=items.filter((r)=>r._status===s).length;
if(n)statusSel.insertAdjacentHTML('beforeend','<option value="'+s+'">'+STATUS[s].label+' ('+n+')</option>');});
[...new Set(items.map((r)=>r.area).filter(Boolean))].sort().forEach((a)=>areaSel.insertAdjacentHTML('beforeend','<option value="'+esc(a)+'">'+esc(a)+'</option>'));
[...new Set(items.flatMap((r)=>r._tags))].sort().forEach((t)=>tagSel.insertAdjacentHTML('beforeend','<option value="'+esc(t)+'">'+esc(t)+'</option>'));

q('subtitle').textContent=SL.subtitle||'';
q('metrics').innerHTML=[['items',items.length],['shortlisted',items.filter((r)=>r._status==='shortlisted').length],
['chosen',items.filter((r)=>r._status==='chosen').length],['rejected',items.filter((r)=>r._status==='rejected').length],
['★ starred',items.filter((r)=>r.starred).length]]
.map(([l,n])=>'<span class="chip"><b>'+n+'</b> '+esc(l)+'</span>').join('');
q('criteria').innerHTML=list(SL.criteria).map((c)=>'<li>'+esc(c)+'</li>').join('');
q('notes').innerHTML=list(SL.notes).map((n)=>'<div class="note">'+esc(n)+'</div>').join('');

q('status').addEventListener('change',draw);q('area').addEventListener('change',draw);q('tag').addEventListener('change',draw);
q('starredOnly').addEventListener('change',draw);q('search').addEventListener('input',draw);
head.querySelectorAll('th[data-sort]').forEach((th)=>th.addEventListener('click',()=>{
const k=th.dataset.sort;if(sortKey===k)ascending=!ascending;else{sortKey=k;ascending=true;}draw();}));
(function(){const n=items.filter((r)=>r.starred).length,lb=q('starredLabel'),cb=q('starredOnly');
if(n)lb.textContent='★ Starred only ('+n+')';else{cb.disabled=true;lb.style.opacity='.55';}})();
draw();
</script>
</body>
</html>
