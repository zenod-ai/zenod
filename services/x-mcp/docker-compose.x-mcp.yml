# Two instances of the vendored X MCP image, differing ONLY by tool allowlist.
#
#   x-mcp-readonly  -> what autonomous Codex fan-out workers see (read tools only)
#   x-mcp-postread  -> attended use only (Claude CLI / Zenod engine approval flow):
#                      read tools PLUS createTweet/deleteTweetById
#
# The gate is topology, not prompts: Codex workers run with approvals bypassed, so
# the only robust way to keep posting gated is to never expose write tools on the
# endpoint they reach. Both instances auth as the same user via long-lived OAuth1
# tokens, so sharing one X app's tokens across both is fine (no refresh contention).
#
# Prereq (once on the host):   docker network create zenod-x-net
# Shared creds live in services/x-mcp/.env (see .env.example).

networks:
  zenod-x-net:
    external: true
    name: zenod-x-net

services:
  x-mcp-readonly:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        XMCP_REF: "63d34362d88ed9f94d54ccd5ecd5bb4d12e11759"
    image: zenod-x-mcp
    container_name: x-mcp-readonly
    env_file: .env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      # READ ONLY — no write operationIds. Confirm ids against the startup tool log.
      X_API_TOOL_ALLOWLIST: "findTweetById,findTweetsById,tweetsRecentSearch,usersIdTweets,findUserById,findUserByUsername,findMyUser"
    networks: [zenod-x-net]
    restart: unless-stopped

  x-mcp-postread:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        XMCP_REF: "63d34362d88ed9f94d54ccd5ecd5bb4d12e11759"
    image: zenod-x-mcp
    container_name: x-mcp-postread
    env_file: .env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      # READ + POST. createTweet is the gated capability; deleteTweetById lets an
      # attended operator undo. Trim to just createTweet if delete should be off.
      X_API_TOOL_ALLOWLIST: "findTweetById,findTweetsById,tweetsRecentSearch,usersIdTweets,findUserById,findUserByUsername,findMyUser,createTweet,deleteTweetById"
    networks: [zenod-x-net]
    restart: unless-stopped
