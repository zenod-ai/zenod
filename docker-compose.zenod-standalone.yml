# docker-compose.zenod-standalone.yml — the THIN standalone Zenod box (Epic 2.3, Z-1/Z-2).
#
# ONE Zenod MCP server, publicly exposed at https://<host>/mcp via Traefik. This is the
# v0 surface: purely an MCP server, NO chat UI, no council, no siblings. It is NOT the
# full-suite docker-compose.tenant.yml (that boots console+council+phylax+… with a chat
# UI, which Epic 2.3 forbids).
#
# Configure-by-hand model (self-host README Option B / the Z-2 thin provisioner sets the
# same vars via the Dokploy API at create-time):
#   VAULT_REPO     owner/name of the memory repo (GitHub)
#   GITHUB_TOKEN   a token that can push to VAULT_REPO (or a GitHub App installation token)
#   ZENOD_PROVIDER + OPENROUTER_API_KEY   the per-tenant metering gateway key (ZD-5)
# It does NOT await provisioning — it self-mints its MCP api_token on first boot and
# serves /mcp immediately (read the token from GET /api/token, per units/zenod/README.md).

networks:
  dokploy-network:
    external: true

volumes:
  zenod-standalone-data:

services:
  zenod:
    image: ghcr.io/zenod-ai/zenod:${ZENOD_IMAGE_TAG:-latest}
    container_name: zenod-${TENANT_NAME:-standalone}
    restart: unless-stopped
    networks: [dokploy-network]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    volumes:
      - zenod-standalone-data:/data
    environment:
      AGENT: zenod
      ZENOD_DATA_DIR: /data
      PORT: "8080"
      # VAULT_REPO / GITHUB_TOKEN / ZENOD_PROVIDER / OPENROUTER_API_KEY are injected via
      # the Dokploy env box at provision (never committed here — secrets stay in the store).
    expose:
      - "8080"
    # Public deploy fronts this with Traefik at https://<host>/mcp (domain added via API).
